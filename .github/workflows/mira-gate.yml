name: mira-gate

# The gate passes when Mira has reviewed the current head and every Mira
# finding is answered. The walkthrough score is information only: since
# 7 October 2026 Mira scores statute mirrors 4/5 because it cannot check
# legal text against the source.
# .github/scripts/mira_gate.py holds the rule; tests/test_mira_gate.py tests it.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  gate:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event.issue.pull_request != null && github.event.comment.user.login == 'viacara-mira[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      # The first mira-confidence run on a head marks when GitHub saw the
      # push. The script only accepts a walkthrough written after it.
      - name: Reset the check for a new head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/check-runs" \
            -f name=mira-confidence -f head_sha="$HEAD_SHA" -f status=completed -f conclusion=neutral \
            -f "output[title]=Waiting for Mira review" \
            -f "output[summary]=Mira has not reviewed this commit yet. Merge is blocked until viacara-mira reviews it and every finding is answered." \
            --silent

      # Always the default branch's copy, so a pull request cannot change the
      # rule that grades it.
      - name: Check out the gate script
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Decide the check
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: python3 .github/scripts/mira_gate.py "$REPO" "$PR_NUMBER"
