name: mira-gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  checks: write
  pull-requests: read

jobs:
  gate:
    if: >
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null && github.event.comment.user.login == 'viacara-mira[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const CHECK_NAME = "mira-confidence";

            async function setCheck(sha, conclusion, title, summary) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: CHECK_NAME,
                head_sha: sha,
                status: "completed",
                conclusion,
                output: { title, summary },
              });
            }

            if (context.eventName === "pull_request") {
              const sha = context.payload.pull_request.head.sha;
              await setCheck(
                sha,
                "neutral",
                "Waiting for Mira review",
                "Mira has not reviewed this commit yet. Merge is blocked until viacara-mira posts a walkthrough with Confidence: 5/5."
              );
              return;
            }

            const body = context.payload.comment.body || "";
            if (!body.includes("mira-walkthrough")) return;

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            const sha = pr.data.head.sha;

            const match = body.match(/Confidence:\s*(\d)\/5/i);
            if (!match) {
              await setCheck(
                sha,
                "failure",
                "Could not read Mira confidence",
                "Mira posted a walkthrough but no `Confidence: n/5` score was found in it."
              );
              return;
            }

            const score = parseInt(match[1], 10);
            if (score === 5) {
              await setCheck(sha, "success", "Mira confidence 5/5", "Mira reports full confidence. Gate passed.");
            } else {
              await setCheck(
                sha,
                "failure",
                `Mira confidence ${score}/5`,
                "This repo requires Confidence: 5/5 from Mira before merge. Address Mira's feedback and push again to trigger re-review."
              );
            }
