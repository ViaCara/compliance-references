name: tag-release

# The gate merges with the workflow token, and a push made with that token
# starts no workflow, so the gate starts this one by dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Each run tags the newest commit on main, so a run that the group cancels
# while it waits loses nothing: the run that replaced it tags the same commit.
concurrency: tag-release

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Tag the newest commit unless it already has a release tag
        run: |
          TAG=$(python3 .github/scripts/release_tag.py)
          if [ -z "$TAG" ]; then
            echo "commit already has a release tag; skipping"
            exit 0
          fi
          git config user.name "compliance-references-bot"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
